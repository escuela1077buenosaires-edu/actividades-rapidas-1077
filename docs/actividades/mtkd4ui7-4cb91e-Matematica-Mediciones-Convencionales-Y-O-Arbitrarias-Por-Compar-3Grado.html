  <script>
    var ACTIVITY = {"tipoActividad":"B","titulo":"Matemática - Medir, comparar e intercalar objetos - 3.º grado","grado":3,"area":"Matemática","cantidadEjercicios":20,"teoriaBreve":{"habilitada":true,"texto":"Para resolver cada ronda, mirá primero qué se está comparando: longitud, peso o capacidad. Después revisá el criterio de orden: de menor a mayor, de menos pesado a más pesado o de menor a mayor capacidad.\n\nSi las medidas usan la misma unidad, podés compararlas por el número. Si no hay instrumento, compará directamente o usá una referencia que se repita, como el mismo vaso para varias jarras.\n\nIntercalar significa ubicar un objeto nuevo en el lugar que le corresponde dentro de una colección que ya está ordenada.","ejemplo":"Si las cintas están ordenadas 0,5 m, 1 m y 1,5 m, una cinta de 1,2 m va entre 1 m y 1,5 m."},"textoBase":"En tercer grado, medir no es solo decir un número. Primero se compara: una tira puede ser más larga que otra, una mochila puede ser menos pesada que una caja, y una botella puede tener tanta capacidad como otra.\n\nLa clase usa comparación directa cuando coloca dos objetos juntos o los sostiene para decidir cuál es mayor, menor o tan pesado como. Cuando no alcanza con mirar, puede usar una referencia: un palito, una cuerda, un vaso medidor o una taza que se pueda transportar.\n\nTambién puede medir con instrumentos conocidos, como regla, cinta métrica, balanza y recipiente graduado. En esta actividad aparecen metro, centímetro, kilogramo, gramo y litro como nombres de uso cotidiano, sin hacer conversiones.\n\nEl desafío es intercalar un objeto nuevo en una colección ordenada. Por ejemplo, si las cintas están ordenadas de menor a mayor: 0,5 m, 1 m y 1,5 m, una cinta de 1,2 m va entre 1 m y 1,5 m. Si los pesos están ordenados de menos pesado a más pesado: 0,5 kg, 1 kg y 1,5 kg, un paquete de 1,25 kg va entre 1 kg y 1,5 kg.","materialComplementario":"Datos de apoyo para las rondas:\n\nLongitudes: 8 cm, 12 cm, 14 cm, 16 cm, 20 cm; y también 0,5 m, 1 m, 1,2 m, 1,5 m y 2 m.\n\nPesos: 0,25 kg, 0,5 kg, 0,75 kg, 1 kg, 1,25 kg, 1,5 kg y 2 kg.\n\nCapacidades: 0,25 l, 0,5 l, 0,75 l, 1 l y 1,5 l. Para comparar jarras sin moverlas, se puede usar siempre el mismo vaso de referencia.","operaciones":{"modo":"fijas","lista":[{"tipo":"seleccion_unica","enunciado":"Las cintas están ordenadas de menor a mayor: 0,5 m, 1 m, 1,5 m y 2 m. ¿Dónde se intercala una cinta de 1,2 m?","opciones":["Entre 1 m y 1,5 m","Antes de 0,5 m","Entre 0,5 m y 1 m","Entre 1,5 m y 2 m","Después de 2 m"],"respuestaCorrecta":"Entre 1 m y 1,5 m","feedbackCorrecto":"Correcto. 1,2 m es mayor que 1 m y menor que 1,5 m.","feedbackIncorrecto":"Incorrecto. La respuesta correcta es: Entre 1 m y 1,5 m. 1,2 m queda después de 1 m y antes de 1,5 m."},{"tipo":"seleccion_unica","enunciado":"Las bolsas están ordenadas de menos pesada a más pesada: 0,5 kg, 1 kg, 1,5 kg y 2 kg. ¿Dónde se intercala una bolsa de 1,25 kg?","opciones":["Entre 1 kg y 1,5 kg","Antes de 0,5 kg","Entre 0,5 kg y 1 kg","Entre 1,5 kg y 2 kg","Después de 2 kg"],"respuestaCorrecta":"Entre 1 kg y 1,5 kg","feedbackCorrecto":"Correcto. 1,25 kg es mayor que 1 kg y menor que 1,5 kg.","feedbackIncorrecto":"Incorrecto. La respuesta correcta es: Entre 1 kg y 1,5 kg. La bolsa nueva pesa más que 1 kg y menos que 1,5 kg."},{"tipo":"seleccion_unica","enunciado":"Los recipientes están ordenados de menor a mayor capacidad: 0,25 l, 0,5 l, 1 l y 1,5 l. ¿Dónde va un recipiente de 0,75 l?","opciones":["Entre 0,5 l y 1 l","Antes de 0,25 l","Entre 0,25 l y 0,5 l","Entre 1 l y 1,5 l","Después de 1,5 l"],"respuestaCorrecta":"Entre 0,5 l y 1 l","feedbackCorrecto":"Correcto. 0,75 l queda entre 0,5 l y 1 l.","feedbackIncorrecto":"Incorrecto. La respuesta correcta es: Entre 0,5 l y 1 l. 0,75 l es más que 0,5 l y menos que 1 l."},{"tipo":"completar","enunciado":"En el texto base, poner un objeto nuevo en una colección ordenada se llama ____.","opciones":["intercalar","sumar","convertir","dibujar","pintar"],"respuestaCorrecta":"intercalar","feedbackCorrecto":"Correcto. Intercalar es ubicar el objeto nuevo en su lugar dentro de una colección ordenada.","feedbackIncorrecto":"Incorrecto. La respuesta correcta es: intercalar. Esa palabra aparece en el texto base."},{"tipo":"verdadero_falso","enunciado":"Un lápiz de 18 cm es más largo que una tira de 15 cm.","opciones":["Verdadero","Falso"],"respuestaCorrecta":"Verdadero","feedbackCorrecto":"Correcto. Como 18 es mayor que 15, el lápiz es más largo.","feedbackIncorrecto":"Incorrecto. La respuesta correcta es: Verdadero. 18 cm es mayor que 15 cm."},{"tipo":"seleccion_unica","enunciado":"Tiras medidas con baldosas iguales están ordenadas así: A mide 4 baldosas, B mide 6 baldosas y C mide 8 baldosas. ¿Dónde va una tira D de 7 baldosas?","opciones":["Entre B y C","Antes de A","Entre A y B","Después de C","En el mismo lugar que A"],"respuestaCorrecta":"Entre B y C","feedbackCorrecto":"Correcto. 7 baldosas queda entre 6 y 8 baldosas.","feedbackIncorrecto":"Incorrecto. La respuesta correcta es: Entre B y C. La tira D mide más que B y menos que C."},{"tipo":"seleccion_unica","enunciado":"Objetos pesados con la misma balanza están ordenados así: pelota 0,3 kg, caja 0,6 kg, libro 0,8 kg y mochila 1,5 kg. ¿Dónde va un estuche de 0,7 kg?","opciones":["Entre caja y libro","Antes de pelota","Entre pelota y caja","Entre libro y mochila","Después de mochila"],"respuestaCorrecta":"Entre caja y libro","feedbackCorrecto":"Correcto. 0,7 kg es más que 0,6 kg y menos que 0,8 kg.","feedbackIncorrecto":"Incorrecto. La respuesta correcta es: Entre caja y libro. El estuche pesa más que la caja y menos que el libro."},{"tipo":"seleccion_unica","enunciado":"Con el mismo vaso de referencia, las jarras A, B, C y D llenan 2, 4, 6 y 8 vasos. ¿Dónde va una jarra que llena 5 vasos?","opciones":["Entre B y C","Antes de A","Entre A y B","Entre C y D","Después de D"],"respuestaCorrecta":"Entre B y C","feedbackCorrecto":"Correcto. 5 vasos queda entre 4 vasos y 6 vasos.","feedbackIncorrecto":"Incorrecto. La respuesta correcta es: Entre B y C. La jarra nueva tiene más capacidad que B y menos que C."},{"tipo":"completar","enunciado":"En el texto base, el elemento transportable que ayuda a comparar se llama ____.","opciones":["referencia","decoración","resultado","color","nombre"],"respuestaCorrecta":"referencia","feedbackCorrecto":"Correcto. Una referencia ayuda a comparar cuando no se pueden juntar los objetos.","feedbackIncorrecto":"Incorrecto. La respuesta correcta es: referencia. El texto base nombra una referencia transportable."},{"tipo":"seleccion_unica","enunciado":"Para comparar cuál objeto pesa más, ¿qué instrumento conviene usar?","opciones":["Balanza","Regla","Cinta métrica","Recipiente graduado","Calendario"],"respuestaCorrecta":"Balanza","feedbackCorrecto":"Correcto. La balanza sirve para comparar pesos.","feedbackIncorrecto":"Incorrecto. La respuesta correcta es: Balanza. La regla y la cinta se usan para longitudes; el recipiente graduado, para capacidades."},{"tipo":"seleccion_unica","enunciado":"Las bandas están ordenadas de menor a mayor: 8 cm, 12 cm, 16 cm y 20 cm. ¿Dónde va una banda de 14 cm?","opciones":["Entre 12 cm y 16 cm","Antes de 8 cm","Entre 8 cm y 12 cm","Entre 16 cm y 20 cm","Después de 20 cm"],"respuestaCorrecta":"Entre 12 cm y 16 cm","feedbackCorrecto":"Correcto. 14 cm queda entre 12 cm y 16 cm.","feedbackIncorrecto":"Incorrecto. La respuesta correcta es: Entre 12 cm y 16 cm. La banda nueva es más larga que 12 cm y más corta que 16 cm."},{"tipo":"verdadero_falso","enunciado":"Si el criterio de orden es la longitud, el color del objeto no decide dónde se intercala.","opciones":["Verdadero","Falso"],"respuestaCorrecta":"Verdadero","feedbackCorrecto":"Correcto. Hay que mirar el criterio pedido: en este caso, la longitud.","feedbackIncorrecto":"Incorrecto. La respuesta correcta es: Verdadero. Si se ordena por longitud, el color no decide el lugar."},{"tipo":"completar","enunciado":"En el texto base, para medir o comparar pesos se nombra la ____.","opciones":["balanza","regla","cinta métrica","recipiente graduado","taza"],"respuestaCorrecta":"balanza","feedbackCorrecto":"Correcto. La balanza es el instrumento asociado al peso.","feedbackIncorrecto":"Incorrecto. La respuesta correcta es: balanza. Esa palabra aparece en el texto base."},{"tipo":"seleccion_unica","enunciado":"Con un vaso medidor igual, la botella A llena 3 vasos, la botella B llena 5 vasos y la botella C llena 4 vasos. ¿Cuál queda en el medio al ordenar por capacidad de menor a mayor?","opciones":["Botella C","Botella A","Botella B","Todas quedan iguales","No se puede saber"],"respuestaCorrecta":"Botella C","feedbackCorrecto":"Correcto. 4 vasos queda entre 3 vasos y 5 vasos.","feedbackIncorrecto":"Incorrecto. La respuesta correcta es: Botella C. Al ordenar 3, 4 y 5 vasos, la cantidad del medio es 4."},{"tipo":"seleccion_unica","enunciado":"Una cinta mide 0,5 m y se le agrega otra de 1 m; juntas miden 1,5 m. En la colección 1 m, 2 m y 3 m, ¿dónde va esa nueva longitud?","opciones":["Entre 1 m y 2 m","Antes de 1 m","Entre 2 m y 3 m","Después de 3 m","En el mismo lugar que 3 m"],"respuestaCorrecta":"Entre 1 m y 2 m","feedbackCorrecto":"Correcto. 1,5 m es mayor que 1 m y menor que 2 m.","feedbackIncorrecto":"Incorrecto. La respuesta correcta es: Entre 1 m y 2 m. La longitud total, 1,5 m, queda entre esas dos medidas."},{"tipo":"seleccion_unica","enunciado":"Una caja pesa 1 kg y se agrega una bolsa de 0,5 kg sobre ella: el conjunto pesa 1,5 kg. En la colección 0,5 kg, 1 kg, 2 kg y 3 kg, ¿dónde va el conjunto?","opciones":["Entre 1 kg y 2 kg","Antes de 0,5 kg","Entre 0,5 kg y 1 kg","Entre 2 kg y 3 kg","Después de 3 kg"],"respuestaCorrecta":"Entre 1 kg y 2 kg","feedbackCorrecto":"Correcto. 1,5 kg es mayor que 1 kg y menor que 2 kg.","feedbackIncorrecto":"Incorrecto. La respuesta correcta es: Entre 1 kg y 2 kg. El conjunto pesa 1,5 kg, que queda entre esas medidas."},{"tipo":"completar","enunciado":"Completa con una frase del texto base: cuando dos objetos pesan igual, uno puede ser ____ el otro.","opciones":["tan pesado como","más largo que","menos largo que","más grande que","menor que"],"respuestaCorrecta":"tan pesado como","feedbackCorrecto":"Correcto. Tan pesado como indica que los pesos son iguales.","feedbackIncorrecto":"Incorrecto. La respuesta correcta es: tan pesado como. Esa frase aparece en el texto base."},{"tipo":"seleccion_unica","enunciado":"Los frascos están ordenados por peso: 0,25 kg, 0,5 kg, 1 kg y 1,5 kg. ¿Dónde va un frasco de 0,75 kg?","opciones":["Entre 0,5 kg y 1 kg","Antes de 0,25 kg","Entre 0,25 kg y 0,5 kg","Entre 1 kg y 1,5 kg","Después de 1,5 kg"],"respuestaCorrecta":"Entre 0,5 kg y 1 kg","feedbackCorrecto":"Correcto. 0,75 kg queda entre 0,5 kg y 1 kg.","feedbackIncorrecto":"Incorrecto. La respuesta correcta es: Entre 0,5 kg y 1 kg. 0,75 kg pesa más que 0,5 kg y menos que 1 kg."},{"tipo":"seleccion_unica","enunciado":"Sin usar regla, ¿qué acción ayuda a comparar directamente dos cuerdas?","opciones":["Poner sus extremos juntos","Mirar solo el color","Pesar las cuerdas","Contar las letras del nombre","Usar una taza como medida de capacidad"],"respuestaCorrecta":"Poner sus extremos juntos","feedbackCorrecto":"Correcto. Poner los extremos juntos permite comparar la longitud de las cuerdas.","feedbackIncorrecto":"Incorrecto. La respuesta correcta es: Poner sus extremos juntos. Así se compara directamente cuál cuerda es más larga."},{"tipo":"verdadero_falso","enunciado":"Si dos botellas no se pueden mover juntas, se puede comparar su capacidad usando el mismo vaso como referencia.","opciones":["Verdadero","Falso"],"respuestaCorrecta":"Verdadero","feedbackCorrecto":"Correcto. El mismo vaso funciona como referencia para comparar capacidades.","feedbackIncorrecto":"Incorrecto. La respuesta correcta es: Verdadero. Usar el mismo vaso permite comparar capacidades de manera indirecta."}],"generador":null},"habilidadesDcp":["El alumno explora mediciones convencionales y/o arbitrarias por comparación directa de longitudes, pesos o capacidades para intercalar objetos en una colección ordenada.","Compara medidas de longitud, peso y capacidad mediante comparación directa o con una referencia adecuada.","Intercala objetos en una colección ya ordenada según el criterio de medida indicado.","Usa medidas cotidianas con números enteros, decimales sencillos y fracciones simples sin realizar conversiones formales entre unidades."],"habilidadesFinales":["Comparó longitudes, pesos y capacidades en situaciones del aula.","Ubicó objetos nuevos dentro de colecciones ordenadas por una medida.","Reconoció cuándo usar comparación directa, balanza, regla, cinta métrica, recipiente graduado o una referencia transportable.","Trabajó con medidas sencillas como 0,5 m, 1,2 m, 1,25 kg y 0,75 l sin convertir unidades."],"palabrasClaveSugeridas":["comparación","longitud","peso","capacidad","intercalar","colección ordenada","referencia","balanza","regla","cinta métrica","recipiente graduado","metro","centímetro","kilogramo","litro"]};

    function byId(id){return document.getElementById(id);} function arr(v){return Array.isArray(v)?v:(v==null?[]:[v]);}
    function norm(v){var s=String(v==null?"":v).toLowerCase(); if(s.normalize)s=s.normalize("NFD").replace(/[\u0300-\u036f]/g,""); return s.replace(/[^a-z0-9]+/g," ").replace(/\s+/g," ").trim();}

    function qrFormatBits(mask){var data=(1<<3)|mask; var rem=data; for(var i=0;i<10;i++)rem=(rem<<1)^(((rem>>>9)&1)?1335:0); return ((data<<10)|(rem&1023))^21522;}

    function qrMatrix(text){var version=9, size=53, mask=0; var m=[], f=[]; for(var y=0;y<size;y++){m[y]=[]; f[y]=[]; for(var x=0;x<size;x++){m[y][x]=false; f[y][x]=false;}} function setFunc(x,y,d){if(x<0||y<0||x>=size||y>=size)return; m[y][x]=!!d; f[y][x]=true;} function setData(x,y,d){m[y][x]=!!d;} function bit(v,i){return ((v>>>i)&1)!==0;} function finder(x0,y0){for(var dy=-1;dy<=7;dy++){for(var dx=-1;dx<=7;dx++){var x=x0+dx,y=y0+dy; var dark=dx>=0&&dx<=6&&dy>=0&&dy<=6&&(dx===0||dx===6||dy===0||dy===6||(dx>=2&&dx<=4&&dy>=2&&dy<=4)); setFunc(x,y,dark);}}} finder(0,0); finder(size-7,0); finder(0,size-7); for(var i=8;i<size-8;i++){setFunc(i,6,i%2===0); setFunc(6,i,i%2===0);} var centers=[6,26,46]; for(var cyi=0;cyi<centers.length;cyi++){for(var cxi=0;cxi<centers.length;cxi++){var cx=centers[cxi], cy=centers[cyi]; if((cx===6&&cy===6)||(cx===46&&cy===6)||(cx===6&&cy===46))continue; for(dy=-2;dy<=2;dy++){for(dx=-2;dx<=2;dx++){setFunc(cx+dx,cy+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1);}}}} setFunc(8,size-8,true); var fmt=qrFormatBits(mask); for(i=0;i<15;i++){var b=bit(fmt,i); if(i<6)setFunc(8,i,b); else if(i<8)setFunc(8,i+1,b); else setFunc(8,size-15+i,b);} for(i=0;i<15;i++){b=bit(fmt,i); if(i<8)setFunc(size-1-i,8,b); else if(i<9)setFunc(15-i-1,8,b); else setFunc(15-i,8,b);} var ver=qrVersionBits(version); for(i=0;i<18;i++){b=bit(ver,i); var a=size-11+(i%3), bb=Math.floor(i/3); setFunc(a,bb,b); setFunc(bb,a,b);} var cws=qrAllCodewords(text); var bits=[]; for(i=0;i<cws.length;i++)qrAppendBits(bits,cws[i],8); var idx=0, upward=true; for(var right=size-1;right>=1;right-=2){if(right===6)right--; for(var vert=0;vert<size;vert++){y=upward?size-1-vert:vert; for(var j=0;j<2;j++){x=right-j; if(!f[y][x]){var val=idx<bits.length?bits[idx++]:0; setData(x,y,!!val!==qrMask(mask,x,y));}}} upward=!upward;} return m;}
    function makeQr(text){var box=byId("qrBox"); if(!box)return; box.innerHTML=""; var matrix; try{matrix=qrMatrix(text);}catch(e){box.textContent="QR no disponible"; var st=byId("sendStatus"); if(st)st.textContent=e.message; return;} var size=matrix.length; box.style.gridTemplateColumns="repeat("+size+",1fr)"; box.style.gridTemplateRows="repeat("+size+",1fr)"; for(var y=0;y<size;y++){for(var x=0;x<size;x++){var cell=document.createElement("span"); if(matrix[y][x])cell.className="on"; box.appendChild(cell);}} var label=byId("qrLabel"); if(label)label.textContent="";}
    function renderFinal(){var st=stats(); var pct=st.total?Math.round((st.correct/st.total)*100):0; var html="<h2>Resumen final y habilidades alcanzadas</h2><div class=\"final-grid\"><div><div class=\"summary-box\" id=\"summaryBox\"><strong>"+st.correct+"/"+st.total+"</strong><br>Correctas: "+st.correct+"<br>Incorrectas: "+st.incorrect+"<br>Porcentaje: "+pct+"%<br>Nota: "+formatGradeForDisplay(st.nota)+"<br>Tiempo: "+elapsedMinutesValue()+" minutos</div><h3>Habilidades alcanzadas</h3><ul class=\"skills-list\" id=\"skillsList\"></ul><div class=\"actions\"><button class=\"secondary\" type=\"button\" onclick=\"restartGame()\">Reiniciar</button></div></div><div class=\"qr-wrap\"><strong>Codigo QR</strong><div class=\"qr\" id=\"qrBox\" aria-label=\"Codigo QR de resultados\"></div><div class=\"qr-label\" id=\"qrLabel\"></div><button class=\"send-btn\" id=\"sendBtn\" type=\"button\">Enviar Actividad</button><div class=\"send-status\" id=\"sendStatus\"></div></div></div>"; byId("app").innerHTML=html; var list=byId("skillsList"); var skills=arr(ACTIVITY.habilidadesFinales); if(!skills.length)skills=arr(ACTIVITY.habilidadesDcp); for(var i=0;i<skills.length;i++){var li=document.createElement("li"); li.textContent=skills[i]; list.appendChild(li);} var send=byId("sendBtn"); send.disabled=!hasStudentId()||!allChecked(); send.onclick=finish; makeQr(JSON.stringify(buildQrPayload())); updateChrome();}
    function mapResultRow(payload){return payload;}
    function postPayload(payload,status){try{var xhr=new XMLHttpRequest(); xhr.open(RESULT_ENDPOINT_METHOD,RESULT_ENDPOINT_URL,true); Object.keys(RESULT_ENDPOINT_HEADERS||{}).forEach(function(key){xhr.setRequestHeader(key,RESULT_ENDPOINT_HEADERS[key]);}); xhr.onreadystatechange=function(){if(xhr.readyState===4){status.textContent=xhr.status>=200&&xhr.status<300?"Actividad enviada.":"No se pudo enviar la actividad.";}}; xhr.onerror=function(){status.textContent="No se pudo enviar la actividad.";}; xhr.send(JSON.stringify(mapResultRow(payload)));}catch(e){status.textContent="No se pudo enviar la actividad.";}}
    function finish(){var status=byId("sendStatus"); if(!hasStudentId()){status.textContent="Ingresa tu ID para enviar."; return;} if(!allChecked()){status.textContent="Completa todas las rondas antes de enviar."; return;} var payload=buildSendPayload(); if(!RESULT_ENDPOINT_URL){status.textContent=RESULT_ENDPOINT_EMPTY_MESSAGE; return;} if(!RESULT_ACTIVITY_ID){status.textContent="No se pudo enviar la actividad."; return;} postPayload(payload,status);}
    buildRounds(); renderTrophies(); timerHandle=setInterval(tick,1000); tick(); introScreen(); updateChrome();
