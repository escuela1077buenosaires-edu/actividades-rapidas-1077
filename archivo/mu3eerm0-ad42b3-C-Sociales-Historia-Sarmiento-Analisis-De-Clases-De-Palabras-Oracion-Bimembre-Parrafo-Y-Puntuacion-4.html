    var CONTENT = {"textoTeorico":"En esta actividad vamos a leer un texto histórico sobre Domingo Faustino Sarmiento con dos miradas. Desde Ciencias Sociales, una persona del pasado puede estudiarse como actor social cuando sus ideas, trabajos y decisiones influyen en otras personas, instituciones o espacios. También se pueden reconocer procesos, como la expansión de la educación pública, y espacios, como San Juan, Chile, Buenos Aires, Paraná o Córdoba. Un proceso no ocurre en un solo instante: reúne hechos relacionados a través del tiempo.\n\nPara comprender un texto histórico no alcanza con memorizar fechas. Conviene preguntar quiénes participan, qué instituciones aparecen, en qué lugares suceden los hechos y qué cambios se producen. Por ejemplo, al estudiar a Sarmiento podemos observar su vida como maestro, periodista, escritor, gobernador y presidente. También podemos analizar la educación pública como un proceso social que involucró escuelas, estudiantes, familias, libros, bibliotecas, maestros, maestras y decisiones del Estado.\n\nDesde Lengua, el análisis de las palabras ayuda a leer mejor. Los sustantivos nombran personas, lugares, instituciones, objetos o ideas: Sarmiento, San Juan, escuela, educación, biblioteca y gobierno son ejemplos. Los adjetivos describen o caracterizan a un sustantivo: pública, populares, nacionales, importantes y polémicas aportan información. Los verbos expresan acciones, procesos o estados: nació, trabajó, escribió, fundó, impulsó, promovió y murió indican qué ocurrió.\n\nUna oración bimembre tiene dos partes principales: sujeto expreso y predicado. El sujeto indica de quién o de qué se habla; su núcleo suele ser un sustantivo. El predicado dice qué hace, qué es o qué sucede; su núcleo suele ser un verbo conjugado. En la oración Sarmiento impulsó la educación pública, el sujeto es Sarmiento y el predicado es impulsó la educación pública. El núcleo del predicado es impulsó.\n\nLos párrafos organizan la información. Cada párrafo desarrolla una idea principal y puede incluir ideas secundarias que la amplían. En un texto histórico, un párrafo puede presentar la infancia de una persona, otro sus obras, otro sus cargos públicos y otro su pensamiento. El punto y aparte ayuda a separar esas unidades de sentido. Por eso, reconocer párrafos permite estudiar sin mezclar datos.\n\nLa puntuación también orienta la lectura. El punto seguido separa oraciones dentro de un mismo párrafo. El punto y aparte cierra un párrafo y anuncia que empezará otra idea. La coma puede separar elementos de una enumeración, como maestro, periodista, escritor y presidente. El punto y coma marca una pausa mayor que la coma y menor que el punto; puede separar partes relacionadas de una oración extensa. Por ejemplo: Sarmiento fue maestro, periodista y escritor; desde esos trabajos defendió la educación.\n\nCuando respondas, lee primero la consigna y vuelve al texto base. Busca palabras clave, identifica si se pregunta por un hecho histórico o por una herramienta de Lengua, y revisa el párrafo donde aparece la información. Así podrás relacionar vida, obra, pensamiento, actores sociales, espacios, procesos y organización del texto.","textoBase":"Domingo Faustino Sarmiento: educación, escritos y acción pública.\n\nDomingo Faustino Sarmiento nació en San Juan el 15 de febrero de 1811. Su nombre completo fue Faustino Valentín Quiroga Sarmiento. Murió el 11 de septiembre de 1888 en Asunción, Paraguay. Por esa fecha, en Argentina se recuerda el Día del Maestro.\n\nSu familia no era rica. Su madre, Paula Albarracín, trabajaba en el telar y valoraba mucho el aprendizaje. Sarmiento aprendió a leer desde pequeño y mantuvo durante toda su vida una relación intensa con los libros. Esa experiencia lo ayudó a pensar que estudiar podía abrir oportunidades para muchas personas.\n\nDe joven trabajó como maestro y también participó en debates políticos de su época. Vivió un tiempo en Chile, donde enseñó, escribió y observó formas de organizar la educación. Al regresar a San Juan fundó el periódico El Zonda. Como escritor publicó obras importantes, entre ellas Facundo y Recuerdos de provincia. En sus textos discutió cómo se organizaba el país y qué lugar debía tener la educación.\n\nSarmiento fue un actor social del siglo XIX porque sus acciones no quedaron solo en su vida privada. Participó en instituciones, escribió para convencer a otros, ocupó cargos públicos y tomó decisiones que afectaron a muchas personas. Fue gobernador de San Juan entre 1862 y 1864. Luego fue presidente de la Nación Argentina entre 1868 y 1874.\n\nDurante su presidencia se creó la Escuela Normal de Paraná, se apoyaron bibliotecas populares y se fortalecieron instituciones científicas, como el Observatorio Astronómico de Córdoba. También se realizó el primer Censo Nacional, en 1869, y se extendieron comunicaciones como el telégrafo. Sarmiento impulsó la educación pública. Las bibliotecas populares acercaron libros a más lectores. Las escuelas públicas ampliaron oportunidades de estudio.\n\nUno de sus grandes logros fue promover la creación de muchas escuelas en distintas provincias. Para Sarmiento, la educación pública podía mejorar la vida social y fortalecer la ciudadanía. Pensaba que un país necesitaba personas alfabetizadas, maestros preparados, libros disponibles e instituciones capaces de sostener el aprendizaje.\n\nSus ideas también deben leerse en contexto. Algunas fueron admiradas y otras resultaron polémicas, especialmente cuando juzgó de manera dura a distintos grupos sociales de su tiempo. Por eso, estudiar a Sarmiento no significa repetir elogios sin pensar. Significa reconocer su importancia histórica, analizar sus decisiones y hacer preguntas sobre sus ideas.\n\nPara estudiar este tema en Ciencias Sociales podemos mirar tres aspectos. Como actor social, Sarmiento aparece junto a maestros, estudiantes, familias, periodistas, gobernantes y lectores. Como proceso, se observa el crecimiento de la educación pública, la formación de docentes y la circulación de libros. Como espacio, aparecen San Juan, Chile, Buenos Aires, Paraná, Córdoba y Asunción, lugares vinculados con su vida, su obra y sus cargos.","materialComplementario":"Ficha de apoyo para estudiar el texto.\n\nLínea de tiempo orientadora: 1811, nacimiento en San Juan; juventud, trabajo como maestro y escritor; 1862, gobernador de San Juan; 1868, inicio de su presidencia; 1870, creación de la Escuela Normal de Paraná; 1888, fallecimiento en Asunción, Paraguay.\n\nCategorías de análisis social: actor social es una persona o grupo que participa en la vida social y toma decisiones; proceso es un conjunto de cambios relacionados a través del tiempo; espacio es el lugar donde ocurren hechos y relaciones sociales. Una institución, como una escuela, una biblioteca o un gobierno, organiza acciones de la sociedad.\n\nGuía de Lengua: para reconocer sustantivos, pregunta qué nombra la palabra. Para reconocer adjetivos, pregunta qué característica agrega. Para reconocer verbos, pregunta qué acción, proceso o estado expresa. Para reconocer una oración bimembre, busca de quién se habla y qué se dice de ese sujeto.\n\nGuía de puntuación: el punto seguido separa oraciones de un mismo párrafo; el punto y aparte separa párrafos; la coma puede ordenar enumeraciones; el punto y coma puede separar partes relacionadas cuando la oración es extensa. La puntuación ayuda a comprender el texto y a estudiar sus ideas principales.","palabrasClaveSugeridas":["Sarmiento","educación pública","actor social","proceso histórico","espacio social","párrafo","oración bimembre","sujeto","predicado","sustantivo","adjetivo","verbo","puntuación","punto y coma"],"habilidadesDcp":["Analiza un texto histórico identificando actores sociales, espacios, procesos e instituciones.","Reconoce información relevante sobre la vida pública, obra educativa, logros y pensamiento de Domingo Faustino Sarmiento.","Reconoce párrafos, ideas principales y marcas de puntuación para comprender textos informativos.","Clasifica sustantivos, adjetivos y verbos en contexto.","Reconoce la estructura de la oración bimembre con sujeto expreso y predicado.","Aplica revisión ortográfica y de puntuación en una situación comunicativa determinada."]};

    function byId(id){return document.getElementById(id);} function norm(v){var s=String(v==null?"":v).toLowerCase(); if(s.normalize){s=s.normalize("NFD").replace(/[\u0300-\u036f]/g,"");} return s.replace(/[^a-z0-9]+/g," ").replace(/\s+/g," ").trim();}
    function sameText(a,b){return norm(a)===norm(b);} function arr(v){return Array.isArray(v)?v:(v==null?[]:[v]);} function sameSet(a,b){var x=arr(a).map(norm).sort(); var y=arr(b).map(norm).sort(); if(x.length!==y.length)return false; for(var i=0;i<x.length;i++){if(x[i]!==y[i])return false;} return true;}

    var highlightTermsCache=null; var stopTerms={a:true,al:true,ante:true,bajo:true,cada:true,con:true,como:true,de:true,del:true,desde:true,durante:true,e:true,el:true,en:true,entre:true,es:true,esa:true,ese:true,esta:true,este:true,hacia:true,hasta:true,la:true,las:true,lo:true,los:true,o:true,para:true,por:true,que:true,se:true,sin:true,sus:true,un:true,una:true,y:true};
    function addHighlightTerm(map,raw,force){var term=String(raw==null?"":raw).replace(/\s+/g," ").trim(); if(!term||term.length>60)return; var n=norm(term); if(!n||stopTerms[n])return; var parts=n.split(" "); var useful=false; for(var i=0;i<parts.length;i++){if(!stopTerms[parts[i]]&&parts[i].length>=3)useful=true;} if(!useful)return; if(!force&&n.length<4)return; map[n]=term;}
    function addHighlightCandidate(map,raw,force){var text=String(raw==null?"":raw); addHighlightTerm(map,text,force); var words=text.split(/[^A-Za-z0-9ÁÉÍÓÚáéíóúÑñÜü]+/); for(var i=0;i<words.length;i++)addHighlightTerm(map,words[i],false);}
    function highlightTerms(){if(highlightTermsCache)return highlightTermsCache; var map={}; arr(CONTENT.palabrasClaveSugeridas).forEach(function(t){addHighlightCandidate(map,t,true);}); var qs=ACTIVITY.preguntas||[]; for(var i=0;i<qs.length;i++){var q=qs[i]; arr(q.opciones).forEach(function(opt){addHighlightCandidate(map,optionText(opt),false);}); arr(q.columnaIzquierda).forEach(function(v){addHighlightCandidate(map,v,false);}); arr(q.columnaDerecha).forEach(function(v){addHighlightCandidate(map,v,false);}); arr(q.destinos||q.categorias).forEach(function(v){addHighlightCandidate(map,v,false);}); addHighlightCandidate(map,q.fragmento,false); addHighlightCandidate(map,q.textoConErrores,false); answerValues(q.respuestaCorrecta).forEach(function(v){addHighlightCandidate(map,v,false);});} highlightTermsCache=Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){return b.length-a.length;}); return highlightTermsCache;}
    function wordChar(ch){return /[A-Za-z0-9ÁÉÍÓÚáéíóúÑñÜü]/.test(ch||"");}
    function highlightText(value){var text=String(value||""); var terms=highlightTerms().filter(function(t){return text.toLowerCase().indexOf(String(t).toLowerCase())>=0;}); if(!terms.length)return escapeHtmlJs(text); var re=new RegExp(terms.map(escapeRegExp).join("|"),"gi"); var out=""; var last=0; text.replace(re,function(match,offset){if(wordChar(text.charAt(offset-1))||wordChar(text.charAt(offset+match.length)))return match; out+=escapeHtmlJs(text.slice(last,offset)); out+="<mark class=\"keyword-mark\">"+escapeHtmlJs(match)+"</mark>"; last=offset+match.length; return match;}); out+=escapeHtmlJs(text.slice(last)); return out;}
    function splitSentences(text){var out=[]; var start=0; for(var i=0;i<text.length;i++){var ch=text.charAt(i); var next=text.charAt(i+1); if((ch==="."||ch==="!"||ch==="?")&&(!next||/\s/.test(next))){out.push(text.slice(start,i+1).replace(/\s+/g," ").trim()); while(i+1<text.length&&/\s/.test(text.charAt(i+1)))i++; start=i+1;}} var rest=text.slice(start).replace(/\s+/g," ").trim(); if(rest)out.push(rest); return out;}
    function textParagraphs(value){var text=String(value||"").replace(/\r\n/g,"\n").replace(/\r/g,"\n").replace(/\n{3,}/g,"\n\n").trim(); var parts=text?text.split(/\n\s*\n/):[]; if(parts.length<2){var sentences=splitSentences(text); parts=[]; var buf=""; for(var i=0;i<sentences.length;i++){var candidate=buf?(buf+" "+sentences[i]):sentences[i]; if(buf&&candidate.length>420){parts.push(buf); buf=sentences[i];}else{buf=candidate;}} if(buf)parts.push(buf);} var html=""; for(var p=0;p<parts.length;p++){var part=String(parts[p]||"").replace(/\s+/g," ").trim(); if(part)html+="<p>"+highlightText(part)+"</p>";} return html;}
